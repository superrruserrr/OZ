# Mises à jour groupées mensuelles, sans auto-merge (R12, R14 — implementation_plan.md § Maintenance).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    # Aucune version proposée avant 14 jours de publication (chaîne d'approvisionnement, lot 0.7).
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # Majeures tranchées dans DEBT.md : D-002 (TypeScript 7 non pris en charge par typescript-eslint),
    # D-001 (types alignés sur Node 24 LTS). Levée manuelle à la clôture de la dette.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    # Aucune version proposée avant 14 jours de publication (chaîne d'approvisionnement, lot 0.7).
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /infra/docker
    target-branch: develop
    schedule:
      interval: monthly
    # Aucune version proposée avant 14 jours de publication (chaîne d'approvisionnement, lot 0.7).
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # D-005 : PostgreSQL suit la majeure de Scaleway Managed PostgreSQL (lot 0.8) ;
    # Redis : licence RSALv2/SSPLv1 et alternative Valkey à évaluer au lot 0.8.
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
      - dependency-name: redis
        update-types: ['version-update:semver-major']
    groups:
      docker:
        patterns: ['*']

  # Images de base des applications (lot 0.8a) : épinglées par condensé dans les Dockerfile.
  - package-ecosystem: docker
    directory: /infra/docker/images
    target-branch: develop
    schedule:
      interval: monthly
    # Aucune version proposée avant 14 jours de publication (chaîne d'approvisionnement, lot 0.7).
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # Node suit la LTS du projet (.nvmrc, Node 24) : une majeure impaire n'est pas LTS et l'image
    # d'exécution distroless reste en nodejs24 (PR #19). Changement de majeure = lot dédié.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      docker-images:
        patterns: ['*']
