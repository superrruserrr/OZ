# Intégration continue (lot 0.7, EX-007, EX-T03) : une PR ne passe que si tous les jobs sont verts.
# Jobs exigés par .github/rulesets : quality, test, build-e2e, security, migrations, containers.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# Une PR dépassée par un nouveau commit est annulée ; develop et main vont toujours au bout.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  STORYBOOK_DISABLE_TELEMETRY: '1'
  DO_NOT_TRACK: '1'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-quality-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-quality-${{ hashFiles('pnpm-lock.yaml') }}-
      # §2.3 : main ne reçoit que des branches release/* et hotfix/* (les règles GitHub ne savent pas
      # restreindre la branche source d'une PR).
      - name: Branche source autorisée vers main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release/*|hotfix/*) echo "✓ $HEAD_REF peut viser main" ;;
            *) echo "✖ main n'accepte que release/* et hotfix/* (reçu : $HEAD_REF)"; exit 1 ;;
          esac
      - run: pnpm format:check
      # Le lint typé lit les types des paquets compilés et du client Prisma généré : typecheck
      # (qui construit les dépendances et génère le client) passe d'abord.
      - run: pnpm typecheck
      - run: pnpm lint
      - name: commitlint (commits de la PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      # Le titre de la PR devient le message du commit squashé dans develop.
      - name: commitlint (titre de la PR)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-test-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-test-${{ hashFiles('pnpm-lock.yaml') }}-
      # Les tests importent les paquets partagés compilés (dist) et le client Prisma généré.
      - run: pnpm exec turbo run build --filter='./packages/*'
      # Unitaires et intégration (Testcontainers sur le Docker du runner), seuils R6 bloquants.
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build-e2e:
    name: build-e2e
    runs-on: ubuntu-24.04
    # ClamAV charge ses signatures en 1 à 3 minutes (parcours n° 10, lot 1.9cb).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Lot 1.3b (D4) : parcours n° 7 et n° 8 contre l'API compilée, pile jetable via Testcontainers
      # (Docker du runner). Aucun artefact : les réponses portent des jetons.
      - run: pnpm test:e2e:api
      # Lot 1.9cb : parcours n° 10 (fichier infecté → rejet + alerte), API et worker compilés,
      # ClamAV jetable. Aucun artefact : les réponses portent des jetons et des URL signées.
      - run: pnpm test:e2e:documents
      # Lot 1.16cbb : parcours n° 9 (export → suppression → anonymisation vérifiée, variante tuteur),
      # API et worker compilés. Aucun artefact : les réponses portent des jetons et des URL signées.
      - run: pnpm test:e2e:gdpr
      # Lot 0.10 : chaque story rendue dans Chromium, interactions `play` et axe-core WCAG 2.1 AA
      # bloquant, puis replis `prefers-reduced-motion` de Button et Field.
      - run: pnpm test:stories
      - run: pnpm --filter @oz/ui build-storybook
      # Storybook n'est pas hébergé avant la recette (DEBT D-051) : build statique en artefact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-static
          path: packages/ui/storybook-static/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: |
            e2e/test-results/
            packages/ui/.vitest/
          retention-days: 14

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Outils (gitleaks, Trivy, Terraform) aux empreintes vérifiées
        run: scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
      # Infrastructure Scaleway (lot 0.8b) : sans identifiant ni état distant ; les tests de sécurité
      # tournent sur un fournisseur simulé. Les lockfiles versionnés font foi (-lockfile=readonly).
      - name: Terraform (format, validité, tests de sécurité)
        working-directory: infra/terraform
        run: |
          "$RUNNER_TEMP/bin/terraform" fmt -check -recursive
          for root in bootstrap envs/staging envs/production; do
            "$RUNNER_TEMP/bin/terraform" -chdir="$root" init -backend=false -input=false -lockfile=readonly
            "$RUNNER_TEMP/bin/terraform" -chdir="$root" validate
          done
          "$RUNNER_TEMP/bin/terraform" -chdir=modules/stack init -backend=false -input=false -lockfile=readonly
          "$RUNNER_TEMP/bin/terraform" -chdir=modules/stack test
      # Tout l'historique de la branche analysée (HEAD) : un secret dans n'importe lequel de ses
      # commits bloque (R8) ; les autres branches récupérées ne sont pas concernées.
      - run: '"$RUNNER_TEMP/bin/gitleaks" git --no-banner --redact .'
      - run: pnpm audit --audit-level=high
      - run: '"$RUNNER_TEMP/bin/trivy" fs --config trivy.yaml .'
      # Bloque dès WARNING / MEDIUM (les règles gratuites classent peu d'alertes en ERROR, DEBT D-029).
      # Seule règle exclue : âge minimal de publication pnpm, en dette (D-027).
      - name: Semgrep (analyse statique, D1)
        run: >-
          docker run --rm --network=host -v "$PWD:/src" -w /src
          semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
          semgrep scan --metrics=off --error
          --severity=WARNING --severity=ERROR
          --config=p/typescript --config=p/javascript --config=p/nodejs --config=p/react
          --config=p/nextjs --config=p/expressjs --config=p/owasp-top-ten --config=p/secrets
          --exclude-rule=package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age

  migrations:
    name: migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: oz_ci
          POSTGRES_PASSWORD: oz_ci
          POSTGRES_DB: oz_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oz_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://oz_ci:oz_ci@localhost:5432/oz_ci
      APP_ENV: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/ci-migrations.sh

  containers:
    name: containers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Outils (Trivy) aux empreintes vérifiées
        run: scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
      # Disque du runner trop juste pour trois images, Chromium et la base Trivy (ENOSPC, PR #17) :
      # outils préinstallés inutiles supprimés d'abord.
      - name: Libérer le disque du runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - run: pnpm exec playwright install --with-deps chromium
      # Images réelles (api, web, admin, worker), analysées avant d'être lancées : HIGH/CRITICAL bloquants.
      - run: docker compose -f infra/docker/compose.smoke.yml build
      # Cache de construction vidé (les images restent) avant le téléchargement de la base Trivy.
      - name: Vider le cache de construction
        run: |
          docker builder prune --all --force
          df -h /
      - run: '"$RUNNER_TEMP/bin/trivy" image --config trivy-image.yaml oz-api:smoke'
      - run: '"$RUNNER_TEMP/bin/trivy" image --config trivy-image.yaml oz-web:smoke'
      - run: '"$RUNNER_TEMP/bin/trivy" image --config trivy-image.yaml oz-admin:smoke'
      - run: '"$RUNNER_TEMP/bin/trivy" image --config trivy-image.yaml oz-worker:smoke'
      - env:
          SMOKE_SKIP_BUILD: '1'
        run: pnpm test:containers
