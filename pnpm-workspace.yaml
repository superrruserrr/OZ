packages:
  - apps/*
  - packages/*

# Aucun script d'installation n'est exécuté (chaîne d'approvisionnement, R12) :
# @scarf/scarf = télémétrie de swagger-ui-dist (refusée) ; @swc/core = binaire fourni par un paquet
# optionnel ; cpu-features, protobufjs, ssh2 = optionnels natifs de testcontainers.
allowBuilds:
  '@scarf/scarf': false
  '@swc/core': false
  cpu-features: false
  protobufjs: false
  ssh2: false

# Correctifs de sécurité forcés sur des dépendances transitives (consignés dans DEPENDENCIES.md).
overrides:
  # GHSA-q7qp-rjg7-q26m (déni de service), tiré par @nestjs/platform-express
  multer: ^2.5.0

catalog:
  typescript: 7.0.2
