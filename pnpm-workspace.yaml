packages:
  - apps/*
  - packages/*

# Aucun script d'installation n'est exécuté (chaîne d'approvisionnement, R12) :
# @scarf/scarf = télémétrie de swagger-ui-dist (refusée) ; @swc/core = binaire fourni par un paquet
# optionnel ; cpu-features, protobufjs, ssh2 = optionnels natifs de testcontainers ;
# @parcel/watcher (tiré par next-intl) = binaire précompilé fourni par un paquet optionnel ;
# prisma = simple contrôle de version de Node (preinstall).
# Seule exception autorisée : @prisma/engines télécharge le moteur de migration de Prisma
# (binaire publié par Prisma, empreinte vérifiée ; décision D5 du lot 0.6).
allowBuilds:
  '@prisma/engines': true
  prisma: false
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': false
  # esbuild (Vite, Storybook) : binaire fourni par un paquet optionnel de plateforme (lot 0.10).
  esbuild: false
  cpu-features: false
  protobufjs: false
  ssh2: false
  # msgpackr-extract (tiré par bullmq via msgpackr, lot 1.9a) : accélérateur natif optionnel,
  # binaires de plateforme précompilés ; msgpackr retombe sur son code JavaScript sans lui.
  msgpackr-extract: false

# Correctifs de sécurité forcés sur des dépendances transitives (consignés dans DEPENDENCIES.md).
overrides:
  # GHSA-q7qp-rjg7-q26m (déni de service), tiré par @nestjs/platform-express
  multer: ^2.5.0
  # GHSA-3f6p-5ww8-9rcr (high) et GHSA-ggr8-5vv4-36mx (high), tirés par prisma@7.9.1 (DEBT D-028) :
  # versions corrigées, celles qu'embarque Prisma 7.10.x.
  mysql2: ^3.24.4
  deepmerge-ts: ^8.0.2

catalog:
  typescript: 6.0.3

# Chaîne d'approvisionnement (lot 0.7, alertes Semgrep) : refuse un paquet dont la publication est moins
# sûre que les versions précédentes (provenance perdue, prise de contrôle possible) et toute
# sous-dépendance venue d'ailleurs que du registre. Âge minimal de publication : DEBT D-027.
trustPolicy: no-downgrade
blockExoticSubdeps: true
# Exceptions nominatives à trustPolicy (autorisées par Gaëtan Wassu, lot 0.10, DEBT D-052) :
# semver@6.3.1 = correctif de sécurité (CVE-2022-25883) publié par l'équipe npm en 2023, sans
# attestation, sur la branche 6 qu'exige Babel (Storybook). Une version exacte, jamais une plage.
trustPolicyExclude:
  - 'semver@6.3.1'
